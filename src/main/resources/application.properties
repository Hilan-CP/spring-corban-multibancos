spring.application.name=business

spring.profiles.active=${APPLICATION_PROFILE:test}
spring.jpa.open-in-view=false

jwt.private.key=${PRIVATE_KEY:classpath:app.key}
jwt.public.key=${PUBLIC_KEY:classpath:app.pub}

server.port=${PORT:8080}
spring.data.redis.host=${REDIS_HOST:localhost}

app.token-issuer=${TOKEN_ISSUER:http://localhost:8080}
